<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Document</title>
        <link rel="stylesheet" href="./card_example.css" />
        <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
        />
    </head>
    <body>
        <button class="open-btn" popovertarget="card-1">
            <img src="Assets/Images/poppy.png" />
        </button>

        <div class="pop" id="card-1" popover>
            <div class="card">
                <div class="image">
                    <img
                        src="Assets/Images/poppy_banner.png"
                        alt="Poppy Playtime banner"
                    />
                </div>
                <div class="info">
                    <div class="about">
                        <button
                            class="close-btn"
                            popovertarget="card-1"
                            popovertargetaction="hide"
                            aria-label="Close"
                        >
                            ✕
                        </button>
                        <h2>Poppy Playime</h2>
                        <p class="genre">Adventure · Horror · Puzzle</p>
                        <p class="desc">
                            You must stay alive in this horror/puzzle adventure.
                            Try to survive the vengeful toys waiting for you in
                            the abandoned toy factory. hack electrical circuits.
                        </p>

                        <div class="interaction">
                            <h3>$29.99</h3>
                            <button
                                type="button"
                                class="wishlist"
                                aria-pressed="false"
                                aria-label="Add to wishlist"
                            >
                                <i class="bi bi-bookmark"></i>
                            </button>
                        </div>

                        <form class="rating-form">
                            <h3>Rating</h3>
                            <fieldset class="rating">
                                <input
                                    type="radio"
                                    id="star5"
                                    name="rating"
                                    value="5"
                                /><label for="star5" title="5 stars"
                                    >&#9733;</label
                                >
                                <input
                                    type="radio"
                                    id="star4"
                                    name="rating"
                                    value="4"
                                /><label for="star4" title="4 stars"
                                    >&#9733;</label
                                >
                                <input
                                    type="radio"
                                    id="star3"
                                    name="rating"
                                    value="3"
                                /><label for="star3" title="3 stars"
                                    >&#9733;</label
                                >
                                <input
                                    type="radio"
                                    id="star2"
                                    name="rating"
                                    value="2"
                                /><label for="star2" title="2 stars"
                                    >&#9733;</label
                                >
                                <input
                                    type="radio"
                                    id="star1"
                                    name="rating"
                                    value="1"
                                /><label for="star1" title="1 star"
                                    >&#9733;</label
                                >
                            </fieldset>
                        </form>
                        <hr />

                        <div class="comment">
                            <h3>Comments</h3>
                            <ul class="review-list"></ul>
                        </div>

                        <form class="review">
                            <fieldset class="rating ratings">
                                <input
                                    type="radio"
                                    id="r-star5"
                                    name="review-rating"
                                    value="5"
                                /><label for="r-star5" title="5 stars"
                                    >&#9733;</label
                                >
                                <input
                                    type="radio"
                                    id="r-star4"
                                    name="review-rating"
                                    value="4"
                                /><label for="r-star4" title="4 stars"
                                    >&#9733;</label
                                >
                                <input
                                    type="radio"
                                    id="r-star3"
                                    name="review-rating"
                                    value="3"
                                /><label for="r-star3" title="3 stars"
                                    >&#9733;</label
                                >
                                <input
                                    type="radio"
                                    id="r-star2"
                                    name="review-rating"
                                    value="2"
                                /><label for="r-star2" title="2 stars"
                                    >&#9733;</label
                                >
                                <input
                                    type="radio"
                                    id="r-star1"
                                    name="review-rating"
                                    value="1"
                                /><label for="r-star1" title="1 star"
                                    >&#9733;</label
                                >
                            </fieldset>
                            <input
                                name="text"
                                placeholder="Write a review"
                                autocomplete="off"
                                required
                            />
                            <button type="submit" class="btn-submit">
                                Post
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </body>
</html>
