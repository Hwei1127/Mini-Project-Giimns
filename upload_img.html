<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Document</title>
        <style>
            .hero {
                width: 100%;
                min-height: 100vh;
                display: flex;
                align-items: center;
                justify-content: center;
            }

            #drop-area {
                width: 500px;
                height: 300px;
                padding: 30px;
                background: #ddd;
                text-align: center;
                box-sizing: border-box;
            }

            #img-view {
                width: 100%;
                height: 100%;
                display: flex;
                align-items: center;
                justify-content: center;
                border: 2px dashed #888;
                box-sizing: border-box;
                background-size: cover;
                background-position: center;
                background-repeat: no-repeat;
            }
        </style>
    </head>
    <body>
        <div class="hero">
            <label for="input-file" id="drop-area">
                <input type="file" accept="image/*" id="input-file" hidden />
                <div id="img-view">Click or drag and drop an image here</div>
            </label>
        </div>

        <script src="upload_img.js"></script>
    </body>
</html>
